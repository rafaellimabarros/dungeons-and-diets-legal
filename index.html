<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dungeons &amp; Diets — Legal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 0%, #4A1080 0%, #2D0A5E 60%, #1A0A36 100%);
      color: #fff;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    }
    .logo {
      width: 72px; height: 72px;
      margin: 0 auto 18px;
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 34px;
      background: rgba(57,255,20,0.12);
      border: 2px solid #39FF14;
    }
    h1 { font-size: 1.6rem; letter-spacing: -0.5px; }
    .tagline { color: #39FF14; font-size: 0.85rem; margin-top: 6px; }
    .sub { color: rgba(255,255,255,0.55); font-size: 0.85rem; margin: 18px 0 24px; line-height: 1.5; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    a.doc {
      display: flex; align-items: center; gap: 14px;
      text-decoration: none;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 16px 18px;
      color: #fff;
      transition: all 0.15s ease;
    }
    a.doc:hover { background: rgba(57,255,20,0.1); border-color: rgba(57,255,20,0.5); transform: translateY(-1px); }
    a.doc .ico { font-size: 22px; flex-shrink: 0; }
    a.doc .txt { flex: 1; text-align: left; }
    a.doc .txt .t { font-weight: 700; font-size: 0.95rem; }
    a.doc .txt .d { font-size: 0.75rem; color: rgba(255,255,255,0.5); margin-top: 2px; }
    a.doc .arrow { color: rgba(255,255,255,0.4); font-size: 18px; }
    footer { margin-top: 26px; font-size: 0.72rem; color: rgba(255,255,255,0.35); }
    footer a { color: rgba(255,255,255,0.55); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">⚔️</div>
    <h1>Dungeons &amp; Diets</h1>
    <p class="tagline">Transforme sua dieta em uma jornada épica</p>
    <p class="sub">Documentos legais do aplicativo. Toque para ler.</p>

    <div class="links">
      <a class="doc" href="privacy-policy.html">
        <span class="ico">🔒</span>
        <span class="txt">
          <span class="t">Política de Privacidade</span>
          <span class="d">Como tratamos seus dados</span>
        </span>
        <span class="arrow">→</span>
      </a>
      <a class="doc" href="terms-of-service.html">
        <span class="ico">📜</span>
        <span class="txt">
          <span class="t">Termos de Uso &amp; EULA</span>
          <span class="d">Regras de uso do aplicativo</span>
        </span>
        <span class="arrow">→</span>
      </a>
    </div>

    <footer>
      Dúvidas? <a href="mailto:rafaellimainfolink@gmail.com">rafaellimainfolink@gmail.com</a>
    </footer>
  </div>
</body>
</html>
